<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The Softplan WebSigner web signer extension: a browser window with a pen nib
       signing in Tessera's patinated bronze and gold. Not the vendor's
       mark: the extension's name says whose program it is. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7f9c"/><stop offset="1" stop-color="#2f5772"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d775"/><stop offset="1" stop-color="#e0ac2e"/>
    </linearGradient>
  </defs>
  <!-- window, its shadow and its page -->
  <rect x="10" y="20" width="108" height="92" rx="12" fill="#1f3a4e"/>
  <rect x="10" y="14" width="108" height="92" rx="12" fill="url(#frame)"/>
  <rect x="18" y="34" width="92" height="64" rx="5" fill="#f4f1ea"/>
  <circle cx="24" cy="24" r="3.5" fill="#f4f1ea" opacity="0.8"/>
  <circle cx="35" cy="24" r="3.5" fill="#f4f1ea" opacity="0.8"/>
  <circle cx="46" cy="24" r="3.5" fill="#f4f1ea" opacity="0.8"/>
  <!-- lines of text and the signature -->
  <g stroke="#c9c2b4" stroke-width="4" stroke-linecap="round">
    <path d="M28 46h50M28 56h40"/>
  </g>
  <path d="M28 82c8-10 12-10 14-2s6 6 10-2 8-6 10 0 6 4 10-2" fill="none" stroke="#1f3a4e" stroke-width="3" stroke-linecap="round"/>
  <!-- pen nib -->
  <g transform="rotate(35 92 72)">
    <path d="M86 44h12v18l-6 22-6-22z" fill="url(#gold)" stroke="#a9781a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M92 62v14" stroke="#a9781a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="92" cy="60" r="2.5" fill="#a9781a"/>
    <rect x="85" y="34" width="14" height="10" rx="2" fill="#1f3a4e"/>
  </g>
</svg>
