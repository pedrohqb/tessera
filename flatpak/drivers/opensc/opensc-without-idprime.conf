# OpenSC's configuration in Tessera while SafeNet's driver is on too (see
# driver.toml): every card driver of OpenSC 0.27 (src/libopensc/ctx.c,
# internal_card_drivers, in the same order) except idprime, whose cards
# (IDPrime, eToken 5110) SafeNet's driver serves. Update this list with
# OpenSC.
app default {
	card_drivers = skeid, dtrust, cardos, gemsafeV1, starcos, tcos,
		oberthur, authentic, iasecc, belpic, entersafe, epass2003,
		rutoken, rutoken_ecp, myeid, dnie, masktech,
		esteid2018, esteid2025, coolkey, muscle, sc-hsm, setcos,
		PIV-II, cac, itacns, isoApplet, gids, openpgp, jpki, npa,
		cac1, nqapplet;
}
