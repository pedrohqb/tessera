# OpenSC's configuration in Tessera (OPENSC_CONF, see driver.toml): OpenSC's
# defaults, every card driver it has, and one reader left alone. For a debug log, start Tessera with
# `flatpak run --env=OPENSC_DEBUG=3 io.github.pedrohqb.Tessera`: it goes to
# the driver's log (data/tessera/logs/opensc.log in Tessera's folder).
app default {
	# GD Burti's tokens (G+D StarSign CUT S): OpenSC has no driver for them,
	# and its probing (selects and status polls) leaves the token hung, for
	# SafeSign too. A reader whose name has this text is never opened.
	ignored_readers = "StarSign";
}
