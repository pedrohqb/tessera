name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libpcsclite-dev
          # For the tests (tests/drivers.rs, the NSS test): SoftHSM, p11-kit's
          # server helper, client module and headers, NSS, openssl and a C
          # compiler for the fake drivers.
          sudo apt-get install -y softhsm2 p11-kit p11-kit-modules libp11-kit-dev libnss3 openssl gcc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
        env:
          # A test whose tools are missing fails here instead of skipping.
          TESSERA_TEST_REQUIRE: "1"
      - name: Window test (tests/gui, through the accessibility tree)
        run: |
          sudo apt-get install -y at-spi2-core python3-pyatspi xvfb xdotool libnss3-tools >/dev/null
          cargo build --locked
          set +e
          xvfb-run -a -s "-screen 0 1100x1300x24" dbus-run-session -- \
            python3 tests/gui/test_window.py > gui.log 2>&1
          status=$?
          set -e
          grep -vE "dbus-daemon|SpiRegistry|dbind" gui.log
          if [ $status -ne 0 ]; then
            msg=$(grep -vE "dbus-daemon|SpiRegistry|dbind" gui.log | tail -n 80 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Window test failed::$msg"
            exit $status
          fi
        env:
          TESSERA_GUI_DUMP: "1"

  distros:
    # What Tessera deduces from the system (the p11-kit path for PJeOffice,
    # whether NSS already loads p11-kit) checked against each distribution
    # itself, with its default packages (src/native.rs,
    # detection_matches_this_system).
    name: Detection on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            install: dnf install -y gcc pkgconf-pkg-config gtk4-devel libadwaita-devel pcsc-lite-devel nss-tools p11-kit git tar
          - name: Debian
            image: debian:stable
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev libpcsclite-dev libnss3-tools p11-kit p11-kit-modules curl ca-certificates git
          - name: Ubuntu
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev libpcsclite-dev libnss3-tools p11-kit p11-kit-modules curl ca-certificates git
          - name: Arch Linux
            image: archlinux:latest
            install: pacman -Syu --noconfirm base-devel gtk4 libadwaita pcsclite nss p11-kit git
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            install: zypper -n install gcc pkgconf gtk4-devel libadwaita-devel pcsc-lite-devel mozilla-nss-tools p11-kit libp11-kit0 curl git tar gzip
    steps:
      - name: Install the distribution's packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Detection matches this system
        run: |
          . "$HOME/.cargo/env"
          set +e
          cargo test --locked --bin tessera -- --ignored --nocapture detection_matches_this_system > test.log 2>&1
          status=$?
          set -e
          tail -n 40 test.log
          report=$(grep "^REPORT:" test.log | sed 's/^REPORT: //' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$report" ] && echo "::notice title=${{ matrix.name }}::$report"
          if [ $status -ne 0 ]; then
            msg=$(tail -n 40 test.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Detection on ${{ matrix.name }}::$msg"
            exit $status
          fi

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check the vendor drivers against their pins and fill in sizes
        run: python3 scripts/pin-drivers.py
      - name: Build
        run: |
          set +e
          # Branch "stable", as FlatPark's: the driver extensions name it as
          # their runtime's version.
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --default-branch=stable \
            --repo=repo build-dir flatpak/io.github.pedrohqb.Tessera.yml > build.log 2>&1
          status=$?
          set -e
          tail -n 25 build.log
          if [ $status -ne 0 ]; then
            # Surface the end of the log as an annotation, readable through
            # the checks API without downloading the full log.
            msg=$(tail -n 60 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flatpak-builder failed::$msg"
            exit $status
          fi
      - name: Build the driver and web signer extensions
        run: |
          # flatpak-builder needs the parent app installed, as the
          # extensions' runtime: the one just built.
          flatpak remote-add --user --no-gpg-verify ci-build repo
          flatpak install --user -y ci-build io.github.pedrohqb.Tessera
          for m in flatpak/extensions/*/io.github.pedrohqb.Tessera.*.yml; do
            name=$(basename "$(dirname "$m")")
            set +e
            flatpak-builder --user --force-clean --default-branch=stable \
              --repo=repo "build-ext-$name" "$m" > "ext-$name.log" 2>&1
            status=$?
            set -e
            tail -n 15 "ext-$name.log"
            if [ $status -ne 0 ]; then
              msg=$(tail -n 60 "ext-$name.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=extension $name failed::$msg"
              exit $status
            fi
          done
      - name: Install each extension (runs its apply_extra on the real downloads)
        run: |
          for m in flatpak/extensions/*/io.github.pedrohqb.Tessera.*.yml; do
            id=$(basename "$m" .yml)
            flatpak install --user -y ci-build "$id"
            dir=$(flatpak info --user --show-location "$id")/files
            python3 - "$dir" <<'EOF'
          import os, sys, tomllib, pathlib
          d = pathlib.Path(sys.argv[1])
          if (d / "driver.toml").exists():
              t = tomllib.loads((d / "driver.toml").read_text())
              module = d / t["module"]
              assert module.exists(), f"{module} missing"
              for tool in t.get("tools", []):
                  exe = d / tool["exec"][0]
                  assert exe.exists(), f"{exe} missing"
              print("ok:", module)
          else:
              # A web signer: its start script, the program it starts and
              # the library the browser plugin loads.
              t = tomllib.loads((d / "signer.toml").read_text())
              for key in ("name", "host", "exec", "chrome_extensions", "firefox_extensions"):
                  assert t.get(key), f"signer.toml: {key} missing"
              start = d / t["exec"]
              assert os.access(start, os.X_OK), f"{start} missing"
              progs = [p.name for p in (d / "extra").iterdir() if p.is_file() and os.access(p, os.X_OK)]
              assert progs, "extra/ has no program"
              libs = list((d / "lib").iterdir())
              assert libs, "lib/ is empty"
              print("ok:", t["name"], progs, [l.name for l in libs])
          EOF
          done
          # The Certisign program's dialog paths, rewritten by apply_extra.
          d=$(flatpak info --user --show-location io.github.pedrohqb.Tessera.Signer.CertisignWebSigner)/files/extra
          if grep -qa /opt/certisign-websigner/res "$d/cswebsigner"; then
            echo "::error::a Certisign dialog path was left unchanged"; exit 1
          fi
          for f in $(grep -oa 'res/[a-z_0-9]*\.glade' "$d/cswebsigner" | sort -u); do
            test -f "$d/$f" || { echo "::error::$f missing"; exit 1; }
          done
      - name: Test repository
        run: |
          # A single-file bundle (flatpak build-bundle) cannot carry
          # extra-data, so the test build ships as a small Flatpak repository
          # instead, with a script that adds it as a local remote.
          flatpak build-update-repo repo
          cp scripts/install-test-repo.sh .
          tar -czf tessera-repo.tar.gz repo install-test-repo.sh
      - name: Release tarball (everything under /app, built against the runtime)
        run: |
          # The whole /app tree: Tessera, its data and driver descriptions,
          # plus the library it bundles (libpcsclite). Laid out as /app, so a
          # package can unpack it there.
          mkdir -p dist
          cp -a build-dir/files dist/tessera
          rm -rf dist/tessera/include dist/tessera/lib/pkgconfig dist/tessera/lib/debug
          tar -C dist -czf tessera-x86_64.tar.gz tessera
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-x86_64
          path: |
            tessera-repo.tar.gz
            tessera-x86_64.tar.gz
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tessera-repo.tar.gz tessera-x86_64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
    permissions:
      contents: write

  flatpark:
    name: FlatPark
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/flatpark.yml
    with:
      tag: ${{ github.ref_name }}
