name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libpcsclite-dev
          # For the tests (tests/drivers.rs, the NSS test): SoftHSM, p11-kit's
          # server helper, client module and headers, NSS, openssl and a C
          # compiler for the fake drivers.
          sudo apt-get install -y softhsm2 p11-kit p11-kit-modules libp11-kit-dev libnss3 openssl gcc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
        env:
          # A test whose tools are missing fails here instead of skipping.
          TESSERA_TEST_REQUIRE: "1"

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check the vendor drivers against their pins and fill in sizes
        run: python3 scripts/pin-drivers.py
      - name: Build
        run: |
          set +e
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo build-dir flatpak/io.github.pedrohqb.Tessera.yml > build.log 2>&1
          status=$?
          set -e
          tail -n 25 build.log
          if [ $status -ne 0 ]; then
            # Surface the end of the log as an annotation, readable through
            # the checks API without downloading the full log.
            msg=$(tail -n 60 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flatpak-builder failed::$msg"
            exit $status
          fi
          # A single-file bundle (flatpak build-bundle) cannot carry
          # extra-data, so the test build ships as a small Flatpak repository
          # instead, with a script that adds it as a local remote.
          flatpak build-update-repo repo
          cp scripts/install-test-repo.sh .
          tar -czf tessera-repo.tar.gz repo install-test-repo.sh
      - name: Release tarball (everything under /app, built against the runtime)
        run: |
          # The whole /app tree: Tessera, its data and driver descriptions,
          # plus the library it bundles (libpcsclite). Laid out as /app, so a
          # package can unpack it there.
          mkdir -p dist
          cp -a build-dir/files dist/tessera
          rm -rf dist/tessera/include dist/tessera/lib/pkgconfig dist/tessera/lib/debug
          tar -C dist -czf tessera-x86_64.tar.gz tessera
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-x86_64
          path: |
            tessera-repo.tar.gz
            tessera-x86_64.tar.gz
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tessera-repo.tar.gz tessera-x86_64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
    permissions:
      contents: write

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libpcsclite-dev \
            libarchive-tools p11-kit p11-kit-modules file
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          set +e
          appimage/build.sh > build.log 2>&1
          status=$?
          set -e
          tail -n 25 build.log
          if [ $status -ne 0 ]; then
            msg=$(tail -n 60 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=AppImage build failed::$msg"
            exit $status
          fi
      - name: Check
        run: |
          ./Tessera-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/tessera
          test -x squashfs-root/usr/bin/bsdtar
          test -s squashfs-root/usr/share/tessera/drivers.list
          if ls squashfs-root/usr/lib/libpcsclite* >/dev/null 2>&1; then
            echo "::error::libpcsclite must come from the system, not the AppImage"
            exit 1
          fi
          # The first start downloads the vendors' drivers, checks them
          # against the pins and unpacks them: every driver must be there.
          squashfs-root/AppRun status > status.txt 2>&1 || true
          cat status.txt
          if ! grep -q "^Drivers:" status.txt || grep -q "files missing" status.txt; then
            msg=$(sed 's/%/%25/g' status.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=A driver is missing after the first start::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-appimage
          path: Tessera-x86_64.AppImage
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Flatpak job creates the release; wait for it.
          for _ in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" Tessera-x86_64.AppImage --clobber
    permissions:
      contents: write
